# MAPPO configuration for mosaic_multigrid 1v1 American Football
# Environment: AmericanFootball1v1Env16x11
# Gymnasium ID: MosaicMultiGrid-AmericanFootball-1v1-v0
# Teams: Green (agent_0) vs Blue (agent_1) -- 1 agent per team
#
# Key details:
# - 2 agents (1 per team), 16x11 grid (14x9 playable)
# - Observations: (3,3,3) = 27 flattened
# - 7 discrete actions
# - Touchdown scoring: walk into opponent's end zone while carrying ball
# - Episode ends at first-to-2 touchdowns or 300 max_steps
# - zero_sum=True: +1 scorer, -1 opponent

agent: "HAPPO"
env_name: "multigrid"
env_id: "american_football_1v1"
env_seed: 1
continuous_action: False
learner: "HAPPO_Learner"
policy: "Categorical_MAAC_Policy"
representation: "Basic_MLP"
vectorize: "DummyVecMultiAgentEnv"
runner: "MARL"

# Recurrent settings (disabled by default)
use_rnn: False
rnn: "GRU"
fc_hidden_sizes: [64, 64]
recurrent_hidden_size: 64
N_recurrent_layers: 1
dropout: 0
normalize: "LayerNorm"
initialize: "orthogonal"
gain: 0.01

# Network architecture -- (7,7,3) = 147 flattened features (MOSAIC_VIEW_SIZE=7)
representation_hidden_size: [128, 128]
actor_hidden_size: [128, 128]
critic_hidden_size: [128, 128]
activation: "relu"
activation_action: "softmax"

# Multi-agent settings
use_parameter_sharing: True  # Symmetric game -- both agents share one policy
use_actions_mask: False

# Training hyperparameters
seed: 1
parallels: 4
buffer_size: 300  # Match max_steps (300) for full-episode buffers
n_epochs: 10
n_minibatch: 1  # MAPPO paper: "fails to solve any maps with 4; 1 produces best on 22/23"
learning_rate: 0.0005
weight_decay: 0

# PPO-specific
vf_coef: 0.5
ent_coef: 0.05
target_kl: 0.25
clip_range: 0.2
clip_type: 1
gamma: 0.99

# Training tricks
use_linear_lr_decay: True
end_factor_lr_decay: 0.1
use_global_state: False
use_value_clip: True
value_clip_range: 0.2
use_value_norm: True
use_huber_loss: True
huber_delta: 10.0
use_advnorm: True
use_gae: True
gae_lambda: 0.95
use_grad_clip: True
grad_clip_norm: 10.0

# Training duration (overridden by shell script via jq)
running_steps: 2000000
eval_interval: 100000
test_episode: 5

# Logging (overridden by runtime)
log_dir: "./logs/happo/"
model_dir: "./models/happo/"
